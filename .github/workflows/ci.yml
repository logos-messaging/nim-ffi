name: CI

on:
  push:
    branches: [master, main]
  # Unfiltered, like linters.yml: a PR stacked on a feature branch is a PR, and
  # a base filter here means it merges with no test job ever having run.
  pull_request:
  # Without this a merge queue runs linters.yml only and merges untested code.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # PRs only: a cancelled push run would leave master without a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Single source of truth for Nim / Nimble versions used by every job and
  # every reusable workflow below. Values live in versions.env at the repo
  # root so they're greppable and editable in one place, next to ffi.nimble.
  # The job exposes them as outputs because the `with:` of a reusable-workflow
  # call only accepts the `needs`, `inputs`, `vars`, and `github` contexts —
  # `env` is not allowed there, which rules out plain workflow-level env vars.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nim-versions: ${{ steps.load.outputs.NIM_VERSIONS }}
      nimble:       ${{ steps.load.outputs.NIMBLE_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        run: cat versions.env >> "$GITHUB_OUTPUT"

  ffi-context:
    name: FFI Context
    needs: versions
    uses: ./.github/workflows/test.yml
    with:
      test: test_ffi_context
      nim-versions:   ${{ needs.versions.outputs.nim-versions }}
      nimble-version: ${{ needs.versions.outputs.nimble }}

  gc-compat:
    name: GC Compatibility
    needs: versions
    uses: ./.github/workflows/test.yml
    with:
      test: test_gc_compat
      nim-versions:   ${{ needs.versions.outputs.nim-versions }}
      nimble-version: ${{ needs.versions.outputs.nimble }}

  serial:
    name: Serial
    needs: versions
    uses: ./.github/workflows/test.yml
    with:
      test: test_serial
      nim-versions:   ${{ needs.versions.outputs.nim-versions }}
      nimble-version: ${{ needs.versions.outputs.nimble }}

  ctx-validation:
    name: Context Validation
    needs: versions
    uses: ./.github/workflows/test.yml
    with:
      test: test_ctx_validation
      nim-versions:   ${{ needs.versions.outputs.nim-versions }}
      nimble-version: ${{ needs.versions.outputs.nimble }}

  foreign-thread:
    # Runs cross-OS to also guard declareLibrary's --app:lib linker-flag check:
    # the fixture compiles FFI code as a plain executable, which would fail to
    # link on macOS if the soname/install_name flags leaked into a non-lib build.
    name: Foreign Thread
    needs: versions
    uses: ./.github/workflows/test.yml
    with:
      test: test_foreign_thread
      nim-versions:   ${{ needs.versions.outputs.nim-versions }}
      nimble-version: ${{ needs.versions.outputs.nimble }}

  listener-reentrancy:
    # The dispatch barrier is a pthread condvar; cover the OSes whose mutex and
    # condvar behaviour differ, not only the Linux sanitizer jobs.
    name: Listener Reentrancy
    needs: versions
    uses: ./.github/workflows/test.yml
    with:
      test: test_event_listener_reentrancy
      nim-versions:   ${{ needs.versions.outputs.nim-versions }}
      nimble-version: ${{ needs.versions.outputs.nimble }}

  recycle-teardown:
    # One job for the whole family: these tests run in seconds while a job's
    # setup takes minutes, so six files share one setup instead of paying it six
    # times. Stable Nim only — thread reuse, thread exit and chronos dispatcher
    # behaviour are what differ here, and they differ per OS, not per compiler
    # version. No ubuntu either: `unit-tests-all` already runs every file on
    # Linux under both Nim versions and both mms.
    name: Recycle & Teardown
    needs: versions
    uses: ./.github/workflows/test.yml
    with:
      test: >-
        test_ffi_teardown test_ffi_recycle_reset test_ffi_claim_generation
        test_ffi_ingress_limits test_ctx_after_failed_ctor test_event_thread
      oses: '["macos-15","windows-latest"]'
      nim-versions: '["stable"]'
      nimble-version: ${{ needs.versions.outputs.nimble }}

  cpp-e2e:
    # Codegen output doesn't vary with mm, so we matrix over OS and Nim only.
    # Windows runs MSVC by default and may surface codegen tweaks needed in
    # the generated CMake (e.g. /EHsc, dllexport) — track follow-ups as bugs
    # if they appear. `fail-fast: false` keeps Linux/macOS results visible.
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
        nim-version: ${{ fromJSON(needs.versions.outputs.nim-versions) }}
        include:
          - os: ubuntu-22.04
            label: Linux
          - os: macos-15
            label: macOS
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: C++ E2E · ${{ matrix.label }} · Nim ${{ matrix.nim-version }}
    env:
      NIMBLE_VERSION: ${{ needs.versions.outputs.nimble }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nimble ${{ env.NIMBLE_VERSION }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            export PATH="$GITHUB_WORKSPACE/.nim_runtime/bin:$PATH"
          fi
          cd /tmp && nimble install "nimble@${{ env.NIMBLE_VERSION }}" -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: Cache nimble deps
        id: cache-nimbledeps
        uses: actions/cache@v4
        with:
          path: |
            nimbledeps/
            nimble.paths
          key: ${{ runner.os }}-nimbledeps-${{ matrix.nim-version }}-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimbledeps-${{ matrix.nim-version }}-
            ${{ runner.os }}-nimbledeps-

      - name: Install nimble deps
        if: steps.cache-nimbledeps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            export PATH="$GITHUB_WORKSPACE/.nim_runtime/bin:$HOME/.nimble/bin:$PATH"
          fi
          nimble setup --localdeps -y

      - name: Cache CMake FetchContent (GoogleTest)
        uses: actions/cache@v4
        with:
          path: tests/e2e/cpp/build/_deps
          # ImageVersion busts the cache when the toolchain (e.g. MSVC) bumps.
          key: ${{ runner.os }}-cpp-e2e-deps-${{ env.ImageVersion }}-${{ hashFiles('tests/e2e/cpp/CMakeLists.txt') }}

      - name: Run C++ e2e tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            export PATH="$GITHUB_WORKSPACE/.nim_runtime/bin:$HOME/.nimble/bin:$PATH"
          fi
          nimble test_cpp_e2e -y

      - name: Run C e2e tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            export PATH="$GITHUB_WORKSPACE/.nim_runtime/bin:$HOME/.nimble/bin:$PATH"
          fi
          nimble test_c_e2e -y

  check-bindings:
    # Single OS is enough — codegen output is platform-independent; the Nim
    # matrix catches version-sensitive output (the PR #39 drift class).
    name: Check generated bindings
    needs: versions
    uses: ./.github/workflows/nimble-job.yml
    with:
      run: nimble check_bindings -y
      nim-versions:   ${{ needs.versions.outputs.nim-versions }}
      nimble-version: ${{ needs.versions.outputs.nimble }}

  rust-bindings:
    # `--examples` reaches api.rs, which no other target uses; build.rs shells out to `nim c`, hence the nimble job.
    name: Build generated Rust bindings
    needs: versions
    uses: ./.github/workflows/nimble-job.yml
    with:
      run: cargo build --locked --manifest-path examples/timer/rust_bindings/Cargo.toml --examples
      nim-versions:   ${{ needs.versions.outputs.nim-versions }}
      nimble-version: ${{ needs.versions.outputs.nimble }}

  unit-tests-all:
    # Catch-all: `nimble test` discovers and runs every test_*.nim under orc and refc, so a new file cannot ship with no run. Linux only: the double compile of ~40 files is the cost, and the jobs above carry the OS-sensitive files across the matrix.
    name: All unit tests (orc + refc)
    needs: versions
    uses: ./.github/workflows/nimble-job.yml
    with:
      run: nimble test -y
      nim-versions:   ${{ needs.versions.outputs.nim-versions }}
      nimble-version: ${{ needs.versions.outputs.nimble }}

  tests-asan-ubsan:
    name: Tests · ASan+UBSan+LSan
    needs: versions
    uses: ./.github/workflows/tests-sanitized.yml
    with:
      sanitizer:      asan-ubsan
      nim-versions:   ${{ needs.versions.outputs.nim-versions }}
      nimble-version: ${{ needs.versions.outputs.nimble }}

  tests-tsan:
    name: Tests · TSan
    needs: versions
    uses: ./.github/workflows/tests-sanitized.yml
    with:
      sanitizer:      tsan
      nim-versions:   ${{ needs.versions.outputs.nim-versions }}
      nimble-version: ${{ needs.versions.outputs.nimble }}

  submit-scaling-gate:
    # Asserts sendRequestToFFIThread submit throughput scales with producer-thread count. It passes at ~11x on the sharded ingress (ffi/ffi_request_queue.nim), so a red run is a regression. Pinned to orc + unsanitized: the gate is timing-based and the contention it measures is mm-independent. Baselines: tests/bench/README.md.
    name: Submit Scaling Gate
    needs: versions
    uses: ./.github/workflows/nimble-job.yml
    with:
      run: NIM_FFI_MM=orc FFI_SUBMIT_PER_THREAD=20000 nimble bench_ffi_submit -y
      nim-versions:   ${{ needs.versions.outputs.nim-versions }}
      nimble-version: ${{ needs.versions.outputs.nimble }}

  auto-assign:
    name: Auto-assign PR author
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - run: gh pr edit "$PR" --repo "$REPO" --add-assignee "$AUTHOR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:   ${{ github.repository }}
          PR:     ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
