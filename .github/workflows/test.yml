name: test

on:
  workflow_call:
    inputs:
      test:
        required: true
        type: string
        description: Space-separated tests/unit base names, e.g. 'test_serial' or 'test_a test_b'. Every one runs; the step fails at the end if any did.
      nim-versions:
        required: true
        type: string
        description: JSON array of Nim versions to run the matrix against, e.g. '["2.2.6","stable"]'.
      oses:
        required: false
        type: string
        default: '["ubuntu-22.04","macos-15","windows-latest"]'
        description: JSON array of runner images. Narrow it when another job already covers an OS.
      nimble-version:
        required: true
        type: string

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses) }}
        nim-version: ${{ fromJSON(inputs.nim-versions) }}
        mm: [orc, refc]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Mapped inline rather than through `include`: an include entry whose `os` is
    # not in the matrix would add a combination of its own instead of a label.
    name: ${{ matrix.os == 'ubuntu-22.04' && 'Linux' || matrix.os == 'macos-15' && 'macOS' || 'Windows' }} · Nim ${{ matrix.nim-version }} · ${{ matrix.mm }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nimble ${{ inputs.nimble-version }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            export PATH="$GITHUB_WORKSPACE/.nim_runtime/bin:$PATH"
          fi
          cd /tmp && nimble install "nimble@${{ inputs.nimble-version }}" -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: Cache nimble deps
        id: cache-nimbledeps
        uses: actions/cache@v4
        with:
          path: |
            nimbledeps/
            nimble.paths
          key: ${{ runner.os }}-nimbledeps-${{ matrix.nim-version }}-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimbledeps-${{ matrix.nim-version }}-
            ${{ runner.os }}-nimbledeps-

      - name: Install nimble deps
        if: steps.cache-nimbledeps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          nimble setup --localdeps -y

      # `buildffi` hardcodes --mm:orc, so the refc leg would rebuild the same lib.
      - name: Build
        if: matrix.mm == 'orc'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            export PATH="$GITHUB_WORKSPACE/.nim_runtime/bin:$HOME/.nimble/bin:$PATH"
          fi
          nimble buildffi -y

      - name: Run ${{ inputs.test }} (${{ matrix.mm }})
        shell: bash
        env:
          TESTS: ${{ inputs.test }}
          MM: ${{ matrix.mm }}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            export PATH="$GITHUB_WORKSPACE/.nim_runtime/bin:$HOME/.nimble/bin:$PATH"
          fi
          # Run every file even after one fails, or the first failure hides the rest.
          failed=""
          for t in $TESTS; do
            nim c -r --mm:"$MM" -d:chronicles_log_level=WARN "tests/unit/$t.nim" || failed="$failed $t"
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi
